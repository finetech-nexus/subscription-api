spring:
  application:
    name: subscription-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/subscriptions;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://iam.dev.sandbox.internal.nbank.fr/auth/realms/customer}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://iam.dev.sandbox.internal.nbank.fr/auth/realms/customer/protocol/openid-connect/certs}

app:
  security:
    disabled: ${DISABLE_AUTH:false}
  internal:
    api-key: ${SUBSCRIPTION_INTERNAL_API_KEY:${INTERNAL_API_KEY:}}
  parrainage:
    # Install / deep-link base; final share URL is {base}/{referralCode}
    share-base-url: ${PARRAINAGE_SHARE_BASE_URL:https://app.nexus-bank.io/r}
  novu:
    # Same Novu bridge used by iam-customs-authenticators for OTP email/SMS.
    trigger-url: ${NOVU_TRIGGER_URL:https://api.novu.co/v1/events/trigger}
    api-key: ${NOVU_API_KEY:}
    parrainage-email-workflow-id: ${PARRAINAGE_EMAIL_WORKFLOW_ID:parrainage-email-workflow}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

---
spring:
  config:
    activate:
      on-profile: insecure
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  app:
    security:
      disabled: true
